name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check dependency security
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm run test:ci -- --runInBand
        env:
          CI: true

      - name: Lint source and tooling
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          CI: false

      - name: Test offline worker
        run: npm run test:offline

      - name: Test chat endpoint
        run: npm run test:chat

      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh build >> "$GITHUB_STEP_SUMMARY"
          find build/assets -name '*.js' -exec du -h {} + | sort -rh | head -5 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          retention-days: 7
