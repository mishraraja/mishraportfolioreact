  <meta name="theme-color" content="#f7f6f3" />
  <script>
    // Apply an explicit visitor preference before paint. Old automatic dark
    // defaults migrate to Observatory; malformed/blocked storage stays light.
    try {
      const saved = JSON.parse(localStorage.getItem("rm.portfolio.state.v1") || "{}");
      const themes = ["observatory", "nebula", "supernova", "deepfield", "solar", "cyberpunk"];
      if (saved && saved.themePreferenceVersion === 2 && saved.themeChosen === true && themes.includes(saved.theme)) {
        document.documentElement.dataset.theme = saved.theme;
        document.querySelector('meta[name="theme-color"]').content = saved.theme === "observatory" ? "#f7f6f3" : "#04060f";
      }
      if (saved && saved.motionPaused === true) document.documentElement.dataset.motion = "paused";
    } catch { /* Light is the safe default when storage is unavailable. */ }
  </script>
